name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Vosk English model (small, ~40 MB)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          uuidgen > app/src/main/assets/model-en-us/uuid
          rm model.zip

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrompterMicTest-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a GitHub Release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
